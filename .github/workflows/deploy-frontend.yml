name: Deploy Frontend (Next.js)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  changes:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'front/**'
              - 'ecosystem.config.js'
              - '.github/workflows/deploy-frontend.yml'
              - 'scripts/deploy-on-server.sh'

  deploy:
    needs: changes
    if: >
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Frontend via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 20m
          script: |
            set -euo pipefail

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            PROJECT_PATH="${{ secrets.PROJECT_PATH }}"
            cd "$PROJECT_PATH"

            echo "📥 Actualizando código..."
            git fetch --all
            git reset --hard origin/main

            echo "🚀 Deploying Next.js Frontend..."
            cd front
            rm -rf .next/
            npm ci
            npm run build

            PM2_BIN="$HOME/.nvm/versions/node/$(nvm version)/bin/pm2"
            "$PM2_BIN" reload "$PROJECT_PATH/ecosystem.config.js" --only gestion-ima-front

            echo "✅ Frontend deployed"
